name: Validate and deploy employee portal
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academy-pages
  cancel-in-progress: true
jobs:
  checks:
    name: Security and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  browser:
    name: Staff-only portal browser tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
  deploy:
    name: Publish login portal without internal training content
    if: github.event_name != 'pull_request'
    needs: [checks, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publish an explicit allowlist (NO internal data.js)
        run: |
          mkdir -p _site/assets
          cp index.html favicon.svg .nojekyll robots.txt _site/
          cp assets/portal.js assets/private.css assets/config.js _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
