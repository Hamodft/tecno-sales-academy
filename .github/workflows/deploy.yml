name: Test and publish TECNO Academy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tecno-pages
  cancel-in-progress: true
jobs:
  checks:
    name: Content and source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  browser:
    name: Full browser and mobile smoke tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - name: Save mobile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reference-preview
          path: mobile-reference.png
          if-no-files-found: ignore
  deploy:
    name: Deploy direct-access knowledge base
    if: github.event_name != 'pull_request'
    needs: [checks,browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage website files
        run: |
          mkdir -p _site/assets
          cp index.html favicon.svg .nojekyll robots.txt _site/
          cp assets/academy.js assets/academy.css assets/catalog.js assets/data.js assets/scenario-bank.js assets/communication.js assets/tecno-logo.svg _site/assets/
          mkdir -p _site/assets/products
          cp assets/products/*.webp _site/assets/products/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
